<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家纺情报站 · 床品行业每日速览</title>
  <meta name="description" content="产品经理的家纺行业情报面板：行业资讯、家纺标准、品牌上新、市场数据、创新机会一站式追踪">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛏️</text></svg>">
</head>
<body>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="brand-mark">🛏️</div>
        <div>
          <h1>家纺情报站</h1>
          <p class="brand-sub">床品行业每日情报 · 产品经理视角</p>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="search">
          <input id="searchInput" type="search" placeholder="搜索情报关键词、标签…" autocomplete="off">
        </div>
        <button id="themeToggle" class="icon-btn" title="切换深色/浅色">🌙</button>
        <span class="today-badge" id="todayBadge">📅 --</span>
      </div>
    </div>
    <nav class="page-nav wrap" aria-label="模块导航">
      <a class="page-link" href="index.html">🏠 情报首页</a>
      <a class="page-link" href="standards.html">📋 家纺标准</a>
      <a class="page-link" href="brands.html">🚀 品牌上新</a>
      <a class="page-link" href="market.html">📊 市场数据</a>
      <a class="page-link" href="insights.html">💡 创新机会</a>
    </nav>
    <nav class="source-nav wrap" id="sourceNav" aria-label="信息源筛选"></nav>
  </header>

  <main class="wrap layout">
    <div class="content">
      <div id="demoBanner"></div>
      <section class="digest" id="digest" aria-label="今日重点"></section>
      <div class="filter-bar" id="filterBar" aria-label="分类筛选"></div>
      <div class="active-conds" id="activeConds" aria-label="已选条件"></div>
      <div class="feed-head"><span id="feedCount" class="feed-count">0 条</span></div>
      <section class="feed" id="feed" aria-label="情报列表"></section>
    </div>

    <aside class="sidebar">
      <section class="panel" id="bookmarksPanel">
        <div class="panel-head">⭐ 我的收藏 <span class="count-pill">0</span></div>
        <div class="panel-body"></div>
      </section>

      <section class="panel" id="sourcesPanel">
        <div class="panel-head">📡 信息源清单</div>
        <div class="panel-body"></div>
      </section>

      <section class="panel">
        <div class="panel-head">🔄 数据更新 <span class="count-pill" id="dataStatus">--</span></div>
        <div class="panel-body" style="padding:14px 16px">
          <p style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:10px">
            <span id="lastUpdated" style="color:var(--ink);font-weight:600">--</span>
          </p>
          <p style="font-size:12px;color:var(--muted);line-height:1.7">
            每日北京时间早 8 点自动从 8 个信息源采集，覆盖全球品牌、床品创新、国内标准、材料技术、消费洞察等维度。
          </p>
        </div>
      </section>
    </aside>
  </main>

  <footer>
    <div class="wrap">
      家纺情报站 · 信息均来自公开行业媒体 · 数据每日自动更新<br>
      <a href="data/news.json">查看当前数据</a>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/taxonomy.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
